
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>CinéTrack - Admin</title>
</head>

<body class="bg-gray-100">

<header class="bg-red-400 shadow-md">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-black italic text-white">
      CinéTrack
    </a>

    <a href="index.html" class="text-white font-bold">
      Utilisateur
    </a>
  </div>
</header>

<div id="adminLayout" class="flex flex-col md:flex-row min-h-screen">

  <div id="contentFormContainer"
       class="w-full md:w-[30%] p-5">

    <div class="p-6 bg-white rounded-2xl shadow-lg">

      <h1 id="formTitle" class="text-2xl font-bold text-center mb-6">
        Ajouter un contenu
      </h1>

      <form id="contentForm" class="space-y-4">

        <div>
          <label for="title" class="block mb-2 font-semibold">Titre</label>
          <input type="text" id="title"
            class="w-full p-3 border rounded-xl" required>
        </div>

        <div>
          <label for="image" class="block mb-2 font-semibold">Image URL</label>
          <input type="url" id="image"
            class="w-full p-3 border rounded-xl" required>
        </div>

        <div>
          <label for="type" class="block mb-2 font-semibold">Type</label>
          <select id="type" class="w-full p-3 border rounded-xl" required>
            <option value="">Choisir un type</option>
            <option value="movie">Film</option>
            <option value="series">Série</option>
          </select>
        </div>

        <div>
          <label for="year" class="block mb-2 font-semibold">Année</label>
          <input type="number" id="year"
            class="w-full p-3 border rounded-xl" required>
        </div>

        <div>
          <label for="description" class="block mb-2 font-semibold">Description</label>
          <textarea id="description"
            class="w-full p-3 border rounded-xl" required></textarea>
        </div>

        <div>
          <label for="duration" class="block mb-2 font-semibold">Durée (minutes)</label>
          <input type="number" id="duration"
            class="w-full p-3 border rounded-xl">
        </div>

        <div>
          <label for="seasons" class="block mb-2 font-semibold">Nombre de saisons</label>
          <input type="number" id="seasons"
            class="w-full p-3 border rounded-xl">
        </div>

        <div>
          <label for="genres" class="block mb-2 font-semibold">Genres</label>
          <input type="text" id="genres"
            placeholder="Action, Drama, Comedy"
            class="w-full p-3 border rounded-xl" required>
        </div>

        <div>
          <label for="directors" class="block mb-2 font-semibold">Réalisateurs</label>
          <input type="text" id="directors"
            class="w-full p-3 border rounded-xl" required>
        </div>

        <div>
          <label for="countries" class="block mb-2 font-semibold">Pays</label>
          <input type="text" id="countries"
            class="w-full p-3 border rounded-xl" required>
        </div>

        <button type="submit" id="submitBtn"
          class="w-full p-3 bg-red-600 text-white font-bold rounded-xl">
          Enregistrer
        </button>

        <button type="button" id="cancelBtn"
          class="hidden w-full p-3 bg-gray-500 text-white rounded-xl">
          Annuler
        </button>

        <p id="formMessage" class="text-center"></p>

      </form>
    </div>
  </div>

  <div class="Admin w-full md:w-[70%] min-w-0 p-5 overflow-x-auto">
  </div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
