
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéTrack</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

    <header class="bg-red-500 text-white shadow-lg">
        <nav class="max-w-7xl mx-auto flex justify-between items-center p-5">
            <a href="index.html" class="text-3xl font-black italic">
                CinéTrack
            </a>

            <a href="admin.html" class="bg-white text-red-500 px-5 py-2 rounded-lg font-bold">
                Admin
            </a>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto p-6">

        <section class="text-center my-8">
            <h1 class="text-4xl font-black mb-3">
                Découvrez vos films préférés
            </h1>

            <p class="text-gray-600">
                Explorez notre collection de films et séries
            </p>
        </section>

        <section class="mb-8">
            <input
                type="text"
                id="searchInput"
                placeholder="Rechercher un film ou une série..."
                class="w-full p-4 rounded-xl border bg-white shadow"
            >
        </section>

        <section class="flex flex-wrap gap-3 mb-8 justify-center">

            <button
                class="filter-btn bg-red-500 text-white px-5 py-2 rounded-lg"
                data-type="all">
                Tous
            </button>

            <button
                class="filter-btn bg-gray-800 text-white px-5 py-2 rounded-lg"
                data-type="movie">
                Films
            </button>

            <button
                class="filter-btn bg-gray-800 text-white px-5 py-2 rounded-lg"
                data-type="series">
                Séries
            </button>

        </section>

        <section>
            <h2 class="text-2xl font-bold mb-5">
                Catalogue
            </h2>

            <div
                id="moviesContainer"
                class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            </div>

            <div
                id="pagination"
                class="flex justify-center flex-wrap mt-8">
            </div>
        </section>

        <section class="mt-12 bg-white p-6 rounded-xl shadow">
            <h2 class="text-2xl font-bold mb-4">
                Mes favoris
            </h2>

            <p class="text-gray-600">
                Vos films et séries préférés sont sauvegardés dans votre navigateur.
            </p>

            <div id="favoritesContainer"
                 class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5 mt-5">
            </div>
        </section>

    </main>

    <footer class="bg-gray-900 text-white text-center p-6 mt-12">
        CinéTrack © 2026
    </footer>

    <script type="module" src="script.js"></script>

</body>
</html>
