<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Admin</title>
</head>
<body>
   
<header class="bg-red-400 shadow-md">

  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

  
    <a href="index.html" class="text-2xl font-black italic text-white">
      CinéTrack
    </a>

   
    <nav aria-label="Navigation principale">
      <ul class="flex items-center gap-6">

        <li>
          <a
            href="admin.html"
            class="text-white font-bold border-b-2 border-white pb-1 hover:text-red-100 transition"
          >
            Admin
          </a>
        </li>

      <a href="index.html" class="text-white font-bold border-b-2 border-white pb-1 hover:text-red-100 transition">
      Utilisateur
    </a>

      </ul>
    </nav>

  </div>

</header>


<div class="flex min-h-screen">
  
<div id="contentFormContainer" class="w-0 opacity-0 overflow-hidden shrink-0 transition-all duration-700">
  <div class="w-full mx-auto  p-15 bg-gray-400 rounded-2xl shadow-2xl">

    <h1 class="text-2xl font-bold italic text-center mb-8">
      Ajouter un contenu
    </h1>

    <form id="contentForm" class="space-y-5">

     
      <div>
        <label for="title" class="block mb-2 font-semibold">
          Titre
        </label>
        <input
          type="text"
          id="title"
          placeholder="Entrer le titre..."
          class="w-full p-3 border rounded-xl outline-none bg-white focus:ring-2 focus:ring-fuchsia-400"
        >
      </div>

      
      <div>
        <label for="image" class="block mb-2 font-semibold">
          Image URL
        </label>
        <input
          type="url"
          id="image"
          placeholder="Entrer l'URL de l'image..."
          class="w-full p-3 border rounded-xl outline-none focus:ring-2 bg-white focus:ring-fuchsia-400"
        >
      </div>

   
      <div>
        <label for="type" class="block mb-2 font-semibold">
          Type
        </label>
        <select
          id="type"
          class="w-full p-3 border rounded-xl bg-white outline-none focus:ring-2 focus:ring-fuchsia-400"
        >
          <option value="">Choisir un type</option>
          <option value="movie">Movie</option>
          <option value="serie">Série</option>
        </select>
      </div>

    
      <div>
        <label for="year" class="block mb-2 font-semibold">
          Année de sortie
        </label>
        <input
          type="number"
          id="year"
          placeholder="Ex : 2005"
          class="w-full p-3 border rounded-xl outline-none focus:ring-2 bg-white focus:ring-fuchsia-400"
        >
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="w-full p-3 bg-red-600 text-white font-bold rounded-xl  hover:bg-fuchsia-700 transition"
      >
        Enregistrer
      </button>

    </form>
  </div>
</div>

  <div class="Admin w-full min-w-0 transition-all duration-700 ease-in-out"></div>
</div>
<div id="modal" class="hidden">
<div id="modalContent">

    </div>
</div>

<script type="module" src="admin.js"></script>
<script type="module" src ="modification.js"></script>
<script type="module" src="suppression.js"></script>
</body>
</html>
